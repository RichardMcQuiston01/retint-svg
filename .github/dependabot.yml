version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows current. Dependabot opens
  # a PR when a newer release exists, updating both the pinned commit SHA and
  # the trailing "# vX.Y.Z" version comment so the pins never silently drift.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # Bundle all action bumps into a single PR instead of one per action.
      github-actions:
        patterns:
          - "*"
