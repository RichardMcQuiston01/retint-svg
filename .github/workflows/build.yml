name: Build

# Builds the shippable projects on every PR and on pushes to main:
#   • SvgTools.Core        (netstandard2.0, shared SVG logic)
#   • SVGToolsShell        (net48, the SharpShell context-menu handler)
#   • ImageTools.Core      (netstandard2.0, shared raster-image logic) + tests
#
# Runs on windows-latest because the shell handler targets .NET Framework 4.8,
# whose reference assemblies ship with the Windows runner image. Building the
# shell project also builds its SvgTools.Core project reference; Core is built
# first on its own to confirm it still compiles independently (which is what
# keeps it portable to the future .NET 8 IExplorerCommand handler).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Third-party actions are pinned to full commit SHAs (not mutable @vN tags)
      # so runs are reproducible and resistant to a tag being repointed upstream.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build SvgTools.Core (netstandard2.0)
        run: dotnet build SvgTools.Core/SvgTools.Core.csproj -c Release

      - name: Build SVGToolsShell (net48)
        run: dotnet build SVGToolsShell.csproj -c Release

      - name: Build ImageTools.Core (netstandard2.0)
        run: dotnet build ImageTools.Core/ImageTools.Core.csproj -c Release

      - name: Test ImageTools.Core
        run: dotnet test ImageTools.Core.Tests/ImageTools.Core.Tests.csproj -c Release

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SVGToolsShell-Release
          path: bin/Release/net48/
          if-no-files-found: error
