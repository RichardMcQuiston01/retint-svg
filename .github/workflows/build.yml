name: Build

# Builds the shippable projects on every PR and on pushes to main:
#   • SvgTools.Core        (netstandard2.0, shared SVG logic)
#   • SVGToolsShell        (net48, the SharpShell context-menu handler)
#   • ImageTools.Core      (netstandard2.0, shared raster-image logic) + tests
#   • ImageResizer.Worker  (net48, out-of-process resize worker — compile only;
#                           its GDI+ pixel work needs a real Windows run to verify)
#
# Runs on windows-latest because the shell handler targets .NET Framework 4.8,
# whose reference assemblies ship with the Windows runner image. Building the
# shell project also builds its SvgTools.Core project reference; Core is built
# first on its own to confirm it still compiles independently (which is what
# keeps it portable to the future .NET 8 IExplorerCommand handler).
#
# A second job (`installer`) compiles the Inno Setup installer from the build
# output and uploads it as an artifact; on a published release it also attaches
# the SVGToolsShell-Setup-<version>.exe to that release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Third-party actions are pinned to full commit SHAs (not mutable @vN tags)
      # so runs are reproducible and resistant to a tag being repointed upstream.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build SvgTools.Core (netstandard2.0)
        run: dotnet build SvgTools.Core/SvgTools.Core.csproj -c Release

      - name: Build SVGToolsShell (net48)
        run: dotnet build SVGToolsShell.csproj -c Release

      - name: Build ImageTools.Core (netstandard2.0)
        run: dotnet build ImageTools.Core/ImageTools.Core.csproj -c Release

      - name: Test ImageTools.Core
        run: dotnet test ImageTools.Core.Tests/ImageTools.Core.Tests.csproj -c Release

      - name: Build ImageResizer.Worker (net48)
        run: dotnet build ImageResizer.Worker/ImageResizer.Worker.csproj -c Release

      # Copy the worker beside the shell assembly so the artifact ships both in
      # the sibling layout the handler (Phase 3) launches the worker from.
      - name: Stage worker into the release output
        shell: bash
        run: cp -r ImageResizer.Worker/bin/Release/net48/. bin/Release/net48/

      # Bundle the ExifTool Windows build (exiftool.exe + exiftool_files\) next to
      # the handler for the "Edit metadata…" action. Fetched at build time rather
      # than committed (see tools/fetch-exiftool.ps1); the ~6 MB package rides
      # along in the artifact and the installer picks it up.
      - name: Fetch ExifTool
        shell: pwsh
        run: ./tools/fetch-exiftool.ps1 -Destination bin/Release/net48

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SVGToolsShell-Release
          path: bin/Release/net48/
          if-no-files-found: error

  # Compile the Inno Setup installer from the build output and publish it as an
  # artifact. When the workflow runs for a *published release*, the finished
  # SVGToolsShell-Setup-<version>.exe is also uploaded to that release as an
  # asset. Inno Setup isn't on the .NET build path, so this is a separate job
  # that reuses the `build` artifact rather than rebuilding.
  installer:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # required only to attach the installer to a release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: SVGToolsShell-Release
          # The .iss references ..\bin\Release\net48 relative to installer/, so
          # restore the artifact to that exact path.
          path: bin/Release/net48

      # Code signing (Azure Trusted Signing) is enabled only when the signing
      # secrets are present AND this is a real release (or a manual dispatch, for
      # testing). PRs and routine main pushes stay unsigned, so CI never depends
      # on the secrets and forks aren't blocked. Secrets are referenced in `run`
      # (masked) and mapped to an output so later steps can gate on them.
      - name: Determine signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] \
             && { [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code signing: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code signing: disabled (no signing secrets, or not a release/dispatch run)"
          fi

      # Sign our own build outputs BEFORE Inno bundles them, so the installed DLL
      # (loaded into explorer.exe) and worker exe carry an Authenticode signature.
      # Non-recursive dll,exe over the output root also re-signs the bundled
      # third-party assemblies (harmless) but skips exiftool_files\.
      - name: Sign build outputs (Azure Trusted Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\bin\Release\net48
          files-folder-filter: dll,exe
          files-folder-recurse: false
          file-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\SVGToolsShell.iss'

      # Sign the finished installer .exe (this is what SmartScreen judges).
      - name: Sign installer (Azure Trusted Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installer\Output
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SVGToolsShell-Installer
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" installer/Output/*.exe --clobber
